name: New places preview (held branch only)
# Runs the closed/missing/new restaurant step on the held branch without publishing
# anything; results are attached to the run for review.
on:
  push:
    branches: [new-places]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: New places
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m scraper.newplaces
      - name: Check candidate websites, then apply again
        run: |
          python -m scraper.links
          python -m scraper.newplaces
      - name: Sheets
        run: python -m scraper.sheets
      - name: Save results to a review branch (not main, not published)
        run: |
          git config user.name "madisonpulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b new-places-results
          git add -f data
          git commit -q -m "New places preview results" || true
          git push -f origin new-places-results
