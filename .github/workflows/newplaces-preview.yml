name: New places preview (held branch only)
# Runs the closed/missing/new restaurant step on the held branch without publishing
# anything; results are attached to the run for review.
on:
  push:
    branches: [new-places]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: New places
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m scraper.newplaces
      - name: Sheets
        run: python -m scraper.sheets
      - uses: actions/upload-artifact@v4
        with:
          name: newplaces
          path: |
            data/newplaces_report.json
            data/overture_places.json
            data/licenses.json
            data/closed_places.json
            data/restaurants.json
            data/venues.json
            data/sheets/MadisonPulse.xlsx
