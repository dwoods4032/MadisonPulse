name: New places preview (held branch only)
# Runs the closed/missing/new restaurant step on the held branch without publishing
# anything; results (and the log) go to the new-places-results branch for review.
on:
  push:
    branches: [new-places]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: New places, link check, apply again, sheets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          { python -m scraper.newplaces && python -m scraper.links && python -m scraper.newplaces && python -m scraper.sheets; } 2>&1 | tee data/preview_log.txt
      - name: Save results to a review branch (not main, not published)
        if: always()
        run: |
          git config user.name "madisonpulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b new-places-results
          git add -f data
          git commit -q -m "New places preview results" || true
          git push -f origin new-places-results
