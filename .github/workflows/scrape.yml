name: Scrape events and publish site

on:
  schedule:
    # Twice a day: about 6 am and 6 pm Madison time (11:17 and 23:17 UTC).
    - cron: "17 11,23 * * *"
  workflow_dispatch:
    inputs:
      rediscover:
        description: "Re-check every venue site for event sources"
        type: boolean
        default: false
      refresh_venues:
        description: "Re-pull the venue list from OpenStreetMap"
        type: boolean
        default: false
  push:
    branches: [main]
    # Scraper code or hand-edited data changed: re-scrape. Site-only changes use site.yml (fast).
    paths: ["scraper/**", "data/recurring.json", "data/venue_overrides.json", "data/sources.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover -s tests -t .

      - name: Venue list (weekly, or on request)
        env:
          # the alcohol check reads place websites with Claude
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ inputs.refresh_venues }}" = "true" ]; then
            python -m scraper.venues
          else
            python -m scraper.venues --if-stale 7
          fi

      - name: Scrape events
        env:
          # Optional. Each source switches on when its key is added under
          # Settings > Secrets and variables > Actions.
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.rediscover }}" = "true" ]; then ARGS="--rediscover"; fi
          python -m scraper.run $ARGS

      - name: Check links
        run: python -m scraper.links || echo "Link check skipped"

      - name: Reference spreadsheets and weights
        run: python -m scraper.sheets

      - name: Save data
        run: |
          git config user.name "madisonpulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Update events $(date -u +%Y-%m-%dT%H:%MZ)"
            # another run may have saved data meanwhile: generated files keep this (newer) run's copy
            git pull --rebase --autostash -X theirs origin main
            git push
          fi

      - name: Build site
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          cp data/events.json data/venues.json data/report.json _site/data/
          if [ -f data/restaurants.json ]; then cp data/restaurants.json _site/data/; fi
          if [ -f data/sources_report.json ]; then cp data/sources_report.json _site/data/; fi
          if [ -f data/activities.json ]; then cp data/activities.json _site/data/; fi
          if [ -f data/weights.csv ]; then cp data/weights.csv _site/data/; fi
          # stamp scripts with this release so browsers never mix an old script with a new page
          V=$(echo "$GITHUB_SHA" | cut -c1-8)
          sed -i "s#src=\"spots.js\"#src=\"spots.js?v=$V\"#; s#src=\"app.js\"#src=\"app.js?v=$V\"#" _site/index.html
          sed -i "s#const SHELL = \"mp-shell-v1\"#const SHELL = \"mp-shell-$V\"#" _site/sw.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
